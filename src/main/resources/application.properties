# Server Port
server.port=8080

# Application Name
spring.application.name=pet-adoption-management-system

# By default, uses H2 in-memory database for instant zero-configuration execution.
# To switch to MySQL, activate the 'mysql' profile:
#   Run with: --spring.profiles.active=mysql
#   Or set: spring.profiles.active=mysql
spring.profiles.active=default

# H2 In-Memory Database Configuration (Default Development)
spring.datasource.url=jdbc:h2:mem:petadoptdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seed Initial Data on startup
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/
