<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration - Pet Adoption Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 3.5rem auto;
        }
        .nav-pills .nav-link {
            border-radius: 0.5rem;
            font-weight: 600;
        }
        .nav-pills .nav-link.active {
            background-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="brand-icon">🐾</span>
                <span>Pet Adoption System</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back to Pets</a>
            </div>
        </div>
    </nav>

    <!-- Main Auth Card -->
    <div class="container">
        <div class="auth-container">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-white border-0 pt-4 px-4 pb-0 text-center">
                    <span class="fs-1">🐶 🐱</span>
                    <h3 class="fw-bold mt-2 text-dark">Welcome to Pet Adopt</h3>
                    <p class="text-muted small">Sign in or register to adopt a rescued friend</p>

                    <!-- Nav Tabs: Login vs Register -->
                    <ul class="nav nav-pills nav-fill bg-light p-1 rounded-3 mb-3" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane">
                                <i class="bi bi-box-arrow-in-right"></i> Sign In
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane">
                                <i class="bi bi-person-plus"></i> Register
                            </button>
                        </li>
                    </ul>
                </div>

                <div class="card-body p-4 pt-2">
                    <div class="tab-content">
                        <!-- LOGIN TAB -->
                        <div class="tab-pane fade show active" id="login-pane">
                            <form id="login-form">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Email Address</label>
                                    <input type="email" id="login-email" class="form-control" required placeholder="admin@petadopt.org">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Password</label>
                                    <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="login-submit-btn">
                                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                                </button>
                            </form>

                            <!-- Demo Quick Login Buttons -->
                            <div class="mt-4 pt-3 border-top">
                                <p class="small text-muted fw-bold mb-2 text-center">⚡ Instant Demo Logins:</p>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-outline-warning text-dark btn-sm flex-grow-1" onclick="quickLogin('admin@petadopt.org', 'admin123')">
                                        <i class="bi bi-shield-lock"></i> Demo Admin
                                    </button>
                                    <button class="btn btn-outline-info text-dark btn-sm flex-grow-1" onclick="quickLogin('sarah@example.com', 'user123')">
                                        <i class="bi bi-person"></i> Demo User
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- REGISTER TAB -->
                        <div class="tab-pane fade" id="register-pane">
                            <form id="register-form">
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Full Name *</label>
                                    <input type="text" id="reg-name" class="form-control" required placeholder="Alex Turner">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Email Address *</label>
                                    <input type="email" id="reg-email" class="form-control" required placeholder="alex@example.com">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Phone Number</label>
                                    <input type="tel" id="reg-phone" class="form-control" placeholder="+1 555-0123">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Create Password *</label>
                                    <input type="password" id="reg-password" class="form-control" required minlength="6" placeholder="At least 6 characters">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Account Role</label>
                                    <select id="reg-role" class="form-select">
                                        <option value="USER" selected>Adopter / Standard User</option>
                                        <option value="ADMIN">Shelter Administrator</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-success w-100 py-2 fw-bold" id="reg-submit-btn">
                                    <i class="bi bi-person-check"></i> Complete Registration
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (Auth.isLoggedIn()) {
            const user = Auth.getUser();
            window.location.href = user.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
        }

        // Login Submission
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-submit-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in...';

            try {
                const response = await Api.login({ email, password });
                Auth.setUser(response);
                showToast('Welcome back, ' + response.fullName + '!', 'success');
                setTimeout(() => {
                    window.location.href = response.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
                }, 800);
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
            }
        });

        // Register Submission
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const btn = document.getElementById('reg-submit-btn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Creating account...';

            try {
                const response = await Api.register({ fullName, email, phone, password, role });
                Auth.setUser(response);
                showToast('Registration successful! Welcome to the family!', 'success');
                setTimeout(() => {
                    window.location.href = response.role === 'ADMIN' ? 'admin.html' : 'index.html';
                }, 1000);
            } catch (err) {
                showToast(err.message, 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-check"></i> Complete Registration';
            }
        });

        // Quick Login Helper
        function quickLogin(email, password) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = password;
            document.getElementById('login-form').dispatchEvent(new Event('submit'));
        }
    </script>
</body>
</html>
